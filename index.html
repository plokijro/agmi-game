<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agmi">
<meta name="theme-color" content="#1f1f21">
<title>Agmi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1f1f21; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; touch-action: none; }
  #safe { position: absolute; visibility: hidden; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; animation: fade .25s ease; }
  .panel { background: #292929; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 26px 24px 18px; width: min(340px, 86vw); text-align: center; animation: popin .2s ease; }
  .panel .line { font-weight: bold; margin-bottom: 14px; line-height: 1.2; }
  .panel button { display: block; width: 100%; border: 0; border-radius: 27px; height: 54px; margin-top: 12px; color: #fff; font: inherit; font-size: 21px; font-weight: bold; cursor: pointer; }
  .panel button:active { transform: scale(0.97); }
  .panel.looks { width: min(420px, 94vw); max-height: 84vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 20px 14px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border-radius: 12px; border: 2px solid transparent; background: rgba(255,255,255,0.04); cursor: pointer; }
  .tile.sel { border-color: #fac233; background: rgba(250,194,51,0.12); }
  .tile span { font-size: 10px; color: #ccc; line-height: 1.1; text-align: center; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes popin { from { transform: scale(.85) } to { transform: scale(1) } }
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="cv"></canvas>
<div id="overlay"></div>
<script src="logic.js"></script>
<script src="audio.js"></script>
<script src="skins.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
